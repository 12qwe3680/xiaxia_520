<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏夏验证系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif}

/* 粉色加载页 */
#loading{
  position:fixed;top:0;left:0;width:100%;height:100vh;
  background: linear-gradient(135deg, #ffd6e7, #ff9eb8);
  display:flex;justify-content:center;align-items:center;
  flex-direction:column;z-index:999;color:#fff;
}
.load-text{
  font-size:28px;margin-bottom:25px;
  text-shadow:0 0 15px #ff69b4;
}
.bar{
  width:80%;height:22px;border-radius:12px;
  background:rgba(255,255,255,0.4);overflow:hidden;
}
.fill{
  height:100%;width:0%;
  background:linear-gradient(90deg, #ff8da8, #ff5c8a);
  transition:width .1s;
}

/* 粉色验证页 */
#verify{
  position:fixed;top:0;left:0;width:100%;height:100vh;
  background:linear-gradient(135deg, #ffe0ef, #ffc0d5);
  display:flex;justify-content:center;align-items:center;
  display:none;
}
.box{
  background:rgba(255,255,255,0.5);
  padding:50px;border-radius:25px;
  backdrop-filter:blur(8px);
  text-align:center;
  box-shadow:0 0 35px rgba(255,105,180,0.5);
}
.title{
  font-size:28px;margin-bottom:25px;color:#ff4d8f;
}
#pwd{
  padding:12px 18px;width:240px;border-radius:25px;
  border:2px solid #ff85a2;background:rgba(255,255,255,0.6);
  color:#d83a6d;font-size:17px;text-align:center;outline:none;
  margin-bottom:20px;
}
button{
  padding:11px 30px;border-radius:25px;
  background:linear-gradient(90deg,#ff85a2,#ff5c8a);
  color:#fff;border:none;font-size:16px;cursor:pointer;
}

/* 飘字特效 */
.love{
  position:fixed;font-size:26px;
  animation:fly 4.5s linear forwards;
  pointer-events:none;z-index:100;
}
@keyframes fly{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(-100vh) rotate(720deg);opacity:0}
}
</style>
</head>
<body>

<div id="loading">
  <div class="load-text">夏夏验证系统加载中...</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div id="verify">
  <div class="box">
    <div class="title">请输入验证口令</div>
    <input type="text" id="pwd" placeholder="输入关键词">
    <br><br>
    <button onclick="check()">验证</button>
  </div>
</div>

<script>
let w=0
let i=setInterval(()=>{
  w+=Math.random()*7
  if(w>=100){
    w=100;clearInterval(i);
    setTimeout(()=>{
      document.getElementById("loading").style.display="none"
      document.getElementById("verify").style.display="flex"
    },600)
  }
  document.getElementById("fill").style.width=w+"%"
},100)

function check(){
  let v=document.getElementById("pwd").value.trim()
  if(v=="夏夏"){
    document.getElementById("verify").style.display="none"
    // 更深的全屏粉色背景
    document.body.style.background="linear-gradient(#ffcce7, #ff9eb8)"
    setInterval(make, 50)
  }else{
    alert("口令错误")
  }
}

function make(){
  let arr=["520","❤️","🌹","💖","💘","💝","💓","💕","💗"]
  let t=arr[Math.floor(Math.random()*arr.length)]
  let d=document.createElement("div")
  d.className="love"
  d.innerText=t
  d.style.left=Math.random()*100+"vw"
  d.style.top="100vh"
  d.style.color=["#ff4d8f","#ff7ba3","#ffaccf","#ffd6e6","#ffffff"][Math.floor(Math.random()*5)]
  d.style.fontSize=18+Math.random()*22+"px"
  document.body.appendChild(d)
  setTimeout(()=>d.remove(),4500)
}
</script>
</body>
</html>
