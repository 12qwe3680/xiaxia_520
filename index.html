<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备擦除模拟界面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 樱花飘落效果 */
        .sakura {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* 粉色渐变光晕 */
        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulse 5s infinite alternate;
        }

        .glow-1 {
            top: 10%;
            left: 10%;
        }

        .glow-2 {
            bottom: 10%;
            right: 10%;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* 终端背景 */
        .terminal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .terminal-line {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
            font-size: 1.2rem;
            line-height: 1.5;
            white-space: nowrap;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 主弹窗 */
        .main-modal {
            background: rgba(30, 30, 60, 0.9);
            border: 1px solid rgba(255, 105, 180, 0.5);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
        }

        .modal-header {
            text-align: center;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff69b4;
        }

        .channel-btn {
            background: rgba(0, 200, 0, 0.8);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 15px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .channel-btn:hover {
            background: rgba(0, 255, 0, 1);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .status-box {
            display: flex;
            align-items: center;
            background: rgba(0, 100, 200, 0.8);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-label {
            margin-right: 10px;
        }

        .status-text {
            color: #ffff00;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .action-btn {
            background: rgba(60, 60, 100, 0.8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(80, 80, 130, 0.9);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }

        .text-content {
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }

        /* 520 爱心元素 */
        .heart {
            position: fixed;
            color: #ff69b4;
            font-size: 20px;
            z-index: 5;
            animation: float 3s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(10deg); }
        }

        /* 音频控制 */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 105, 180, 0.8);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .audio-control:hover {
            background: rgba(255, 105, 180, 1);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }
    </style>
</head>
<body>
    <!-- 粉色光晕 -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- 终端背景文字 -->
    <div class="terminal-bg" id="terminalBg"></div>

    <!-- 樱花容器 -->
    <div id="sakura-container"></div>

    <!-- 爱心容器 -->
    <div id="heart-container"></div>

    <!-- 主弹窗 -->
    <div class="main-modal">
        <div class="modal-header">夏夏</div>
        <button class="channel-btn">夏夏</button>
        <div class="status-box">
            <span class="status-label">发送状态：</span>
            <span class="status-text">发送中</span>
        </div>
        <button class="action-btn" id="initBtn">初始化程序</button>
        <button class="action-btn">安全退出</button>
        <div class="text-content">
            我的设备遇到了什么问题？<br>
            我们已对你的设备进行全量擦除<br>
            如何解开 深度刷机<br>
            本程序会对你的设备所有底层分区写入1mb句包括boot分区
        </div>
    </div>

    <!-- 音频控制 -->
    <button class="audio-control" id="audioBtn">播放音乐</button>
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    

    <script>
